name: Release

# Cross-compiles ferrum for Linux/Windows/macOS and publishes the archives
# (plus a checksums.txt) as GitHub Release assets whenever a "vX.Y.Z" tag is
# pushed. Everything here is a thin wrapper around scripts/build.sh, so a
# local `scripts/build.sh all` produces the exact same artifacts.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and (re)publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/build.sh derives VERSION from `git describe`
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install zip
        run: command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Build & package all platforms
        run: bash scripts/build.sh all

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ferrum_*.tar.gz
            dist/ferrum_*.zip
            dist/checksums.txt
